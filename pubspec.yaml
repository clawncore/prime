name: prime_flutter
description: "CLAWN PRIME — Autonomous AI Command Center"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  just_audio: ^0.9.42
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.3
  window_manager: ^0.4.2
  tray_manager: ^0.5.0
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  uuid: ^4.5.1
  collection: ^1.19.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/prime/startup/
    - assets/audio/prime/wake/
    - assets/audio/prime/processing/
    - assets/audio/prime/response/
    - assets/audio/prime/alerts/
    - assets/audio/prime/ui/
    - assets/audio/prime/power/
    - assets/audio/prime/
